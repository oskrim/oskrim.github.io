<ul class="social-media-list">
  {%- if site.github_username -%}
    <li>
      <a href="https://github.com/{{ site.github_username | cgi_escape | escape }}">
        <svg class="svg-icon" aria-hidden="true"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
        <span class="username">{{ site.github_username | escape }}</span>
      </a>
    </li>
  {%- endif -%}
  {%- if site.x_username -%}
    <li>
      <a href="https://x.com/{{ site.x_username | cgi_escape | escape }}" aria-label="X: {{ site.x_username | escape }}" title="{{ site.x_username | escape }}">
        <span class="svg-icon x-icon" aria-hidden="true">𝕏</span>
        <span class="username">{{ site.x_username | escape }}</span>
      </a>
    </li>
  {%- endif -%}
</ul>
