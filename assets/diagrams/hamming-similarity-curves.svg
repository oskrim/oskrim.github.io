<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="hamming-curves-title hamming-curves-description">
  <title id="hamming-curves-title">Inverse Hamming similarity by vector length</title>
  <desc id="hamming-curves-description">A graph comparing normalized binary dot product with inverse Hamming similarity for 32, 128, and 512 bit vectors over angles from zero to ninety degrees. Inverse Hamming falls much more sharply, especially for longer vectors.</desc>
  <style>
    text { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
    .label { fill: #686868; font-family: Georgia, serif; font-size: 14px; font-style: italic }
    .axis { fill: none; stroke: #686868; stroke-width: 1 }
    .grid { fill: none; stroke: #dadce0; stroke-width: 1 }
    .curve { fill: none; stroke-linecap: round; stroke-linejoin: round }
    .dot { stroke: #5f6368; stroke-width: 2.25 }
    .bits-32 { stroke: #f9ab00; stroke-width: 2.25 }
    .bits-128 { stroke: #4285f4; stroke-width: 3.25 }
    .bits-512 { stroke: #a142f4; stroke-width: 2.25 }
    .legend { font-size: 10px; font-weight: 600 }
  </style>

  <g class="legend">
    <path class="curve dot" d="M330 43h22"/><text x="358" y="47">dot product</text>
    <path class="curve bits-32" d="M438 43h22"/><text x="466" y="47">32 bits</text>
    <path class="curve bits-128" d="M526 43h22"/><text x="554" y="47">128 bits</text>
    <path class="curve bits-512" d="M624 43h22"/><text x="652" y="47">512 bits</text>
  </g>

  <g aria-hidden="true">
    <path class="grid" d="M72 74h620M72 128h620M72 182h620M72 236h620M72 290h620"/>
    <path class="grid" d="M175.3 74v216M278.7 74v216M382 74v216M485.3 74v216M588.7 74v216"/>
    <path class="axis" d="M72 74v216h620"/>
  </g>

  <text class="label" x="382" y="326" text-anchor="middle">θ</text>

